[project]
name = "xltpl"
version = "0.0.0"
description = "Module to render xls{,x} files from templates"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Adfinis AG", email = "info@adfinis.com" },
    { name=  "Zhang Yu", email = "zhangyu836@gmail.com"},
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "xlwt>=1.3.0",
]
[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
